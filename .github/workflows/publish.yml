name: Publish

on:
  push:
    tags:
      - "release-*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    # Trusted publishing mints a short-lived credential per run, so there is no
    # NPM_TOKEN anywhere in this repository. `id-token: write` is what lets
    # GitHub issue the OIDC token that npm exchanges for publish rights.
    # Note that npm only supports this on GitHub-hosted runners.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # Deliberately not .nvmrc. That file pins the minimum runtime we support
      # for consumers; trusted publishing needs npm 11.5.1 or newer, which is
      # what Node 24 ships. `registry-url` is omitted because the default is
      # already registry.npmjs.org and setting it only adds an `_authToken`
      # line to the runner .npmrc, which is exactly what OIDC exists to avoid.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate package metadata
        run: pnpm publint

      - name: Validate type resolution
        run: pnpm attw

      # Fails loudly rather than letting the publish fall through to a confusing
      # ENEEDAUTH if a future runner image ships an npm without OIDC support.
      - name: Verify npm supports trusted publishing
        run: |
          npm_version="$(npm --version)"
          echo "node $(node --version) / npm ${npm_version}"
          if [ "$(printf '%s\n11.5.1\n' "${npm_version}" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "npm ${npm_version} is too old for OIDC trusted publishing; need >= 11.5.1" >&2
            exit 1
          fi

      # Published with npm rather than pnpm: pnpm only recently let an OIDC
      # credential take precedence over a configured token, and this repo pins
      # an older pnpm. Nothing is lost here — the package has no runtime or
      # workspace dependencies for pnpm to rewrite.
      - name: Publish
        run: npm publish --access public --provenance
