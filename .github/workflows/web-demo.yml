name: Web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Required by actions/deploy-pages v4 and newer, which resolves the artifact
  # through the Actions API.
  actions: read

concurrency:
  group: web-demo-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm --filter @budiauktioner/web-demo build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: samples/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
